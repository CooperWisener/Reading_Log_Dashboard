name: Build installers (macOS + Windows)

# Builds the macOS .dmg and Windows .exe in parallel. Run manually from the
# Actions tab to get downloadable artifacts, or push a version tag (e.g. v1.0.0)
# to ALSO publish both installers to a GitHub Release with a permanent link.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            # --universal = one .dmg for both Apple Silicon and Intel Macs.
            build_cmd: npx electron-builder --mac --universal --publish never
            artifact_name: macos-dmg
            artifact_path: release/*.dmg
          - os: windows-latest
            build_cmd: npx electron-builder --win nsis --publish never
            artifact_name: windows-exe
            artifact_path: release/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build renderer (Vite)
        run: npx vite build

      - name: Build installer
        run: ${{ matrix.build_cmd }}
        env:
          # No Apple Developer certs on CI → build UNSIGNED instead of failing.
          # (Harmless on the Windows runner.)
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  # Runs only on a pushed tag: gathers both installers and attaches them to the
  # tag's GitHub Release. Permanent link: …/releases/latest
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          fail_on_unmatched_files: true
          generate_release_notes: true
